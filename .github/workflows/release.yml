name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/bin/sed -i '' "s/CFBundleShortVersionString: .*/CFBundleShortVersionString: \"$VERSION\"/" project.yml

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Beacon.xcodeproj -scheme Beacon -configuration Release \
            -derivedDataPath build -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" \
            build

      - name: Package .app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent Beacon.app "$GITHUB_WORKSPACE/Beacon-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Beacon-*.zip
          generate_release_notes: true
          body: |
            ### Beacon ${{ github.ref_name }}

            Download `Beacon-*.zip`, unzip, and move **Beacon.app** to /Applications.

            > This build is **not notarized**. macOS Gatekeeper will warn on first launch —
            > right-click the app → **Open**, or run
            > `xattr -dr com.apple.quarantine /Applications/Beacon.app`.
