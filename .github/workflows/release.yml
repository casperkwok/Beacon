name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/bin/sed -i '' "s/CFBundleShortVersionString: .*/CFBundleShortVersionString: \"$VERSION\"/" project.yml
          /usr/bin/sed -i '' "s/CFBundleVersion: .*/CFBundleVersion: \"$VERSION\"/" project.yml

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Generate project
        run: xcodegen generate

      - name: Build & sign
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project Beacon.xcodeproj -scheme Beacon -configuration Release \
            -derivedDataPath build -destination 'platform=macOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            build

      - name: Re-sign Sparkle helpers
        run: |
          APP="build/Build/Products/Release/Beacon.app"
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          sign() { codesign --force --options runtime --timestamp --sign "Developer ID Application" "$1"; }
          # Inside-out: nested XPC services, helper tools, then the framework, then the app.
          find "$FW" -name "*.xpc" -print0 | while IFS= read -r -d '' xpc; do sign "$xpc"; done
          [ -e "$FW/Versions/Current/Autoupdate" ]  && sign "$FW/Versions/Current/Autoupdate"
          [ -e "$FW/Versions/Current/Updater.app" ] && sign "$FW/Versions/Current/Updater.app"
          sign "$FW"
          sign "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize & staple
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          APP="build/Build/Products/Release/Beacon.app"
          echo "$AC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/ac_key.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/ac_key.p8" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"

      - name: Package
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent Beacon.app "$GITHUB_WORKSPACE/Beacon-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Beacon-*.zip
          generate_release_notes: true
          body: |
            ### Beacon ${{ github.ref_name }}

            Download `Beacon-*.zip`, unzip, and move **Beacon.app** to /Applications.
            This build is **signed and notarized** by Apple — it opens without warnings.

      - name: Publish appcast (Sparkle)
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          ZIP="Beacon-${GITHUB_REF_NAME}.zip"
          gh release download -R sparkle-project/Sparkle --pattern "Sparkle-*.tar.xz" -O "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle_key"
          SIGINFO="$("$RUNNER_TEMP"/sparkle/bin/sign_update "$ZIP" --ed-key-file "$RUNNER_TEMP/sparkle_key")"
          rm -f "$RUNNER_TEMP/sparkle_key"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}"
          git checkout -f main
          python3 .github/update_appcast.py "${GITHUB_REF_NAME#v}" "$URL" "$SIGINFO"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "appcast: ${GITHUB_REF_NAME}" || { echo "no appcast change"; exit 0; }
          git push origin main
