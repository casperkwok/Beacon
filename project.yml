name: Beacon
options:
  bundleIdPrefix: com.casperkwok
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit
    from: 0.6.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Beacon:
    type: application
    platform: macOS
    sources:
      - Beacon
    dependencies:
      - package: TOMLKit
      - package: Sparkle
    info:
      path: Beacon/Info.plist
      properties:
        CFBundleDisplayName: Beacon
        CFBundleName: Beacon
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 casperkwok. Licensed under Apache-2.0."
        SUFeedURL: "https://raw.githubusercontent.com/casperkwok/Beacon/main/appcast.xml"
        SUPublicEDKey: "GD9mNBQnjspJBfKb5chqAVYm9J2rmx0ypXQc1gfJFsU="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: Beacon/Beacon.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.casperkwok.Beacon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
